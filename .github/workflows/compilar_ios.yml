name: Compilar iOS (Sin Firma)

on:
  workflow_dispatch: 

jobs:
  build-ios:
    runs-on: macos-latest 

    steps:
      - name: Clonar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Instalar dependencias
        run: flutter pub get

      - name: Preparar motor de iOS (Sin compilar)
        # Flutter solo generará los archivos nativos pero se detendrá antes de bloquearnos
        run: flutter build ios --release --config-only

      - name: Compilación Nativa Forzada (Bypass de Flutter)
        # Llamamos al compilador de Apple directamente e inyectamos la anulación de firmas en su núcleo
        run: |
          cd ios
          xcodebuild -workspace Runner.xcworkspace -scheme Runner -configuration Release -sdk iphoneos SYMROOT=$(PWD)/build CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: Empaquetar a formato instalable (.ipa)
        run: |
          mkdir Payload
          # Extraemos la app de la carpeta donde xcodebuild la arrojó
          mv ios/build/Release-iphoneos/Runner.app Payload/
          zip -r RescueNet.ipa Payload

      - name: Subir el archivo compilado
        uses: actions/upload-artifact@v4
        with:
          name: RescueNet-iOS-IPA
          path: RescueNet.ipa