workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter packages pub get
      - name: Compilar iOS forzando omisión de firma
        script: |
          flutter build ios --release --no-codesign \
            --dart-define=FLUTTER_WEB_USE_SKIA=true \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="-" \
            EXPANDED_CODE_SIGN_IDENTITY="-" \
            PROVISIONING_PROFILE="" \
            PROVISIONING_PROFILE_SPECIFIER=""
      - name: Empaquetar el artefacto (.app a .ipa sin firmar)
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/unsigned_app.ipa