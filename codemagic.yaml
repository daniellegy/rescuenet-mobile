workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter packages pub get
      - name: Inyectar variables para omitir firma en Xcode
        script: |
          echo "CODE_SIGNING_ALLOWED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGNING_REQUIRED = NO" >> ios/Flutter/Release.xcconfig
          echo "CODE_SIGN_IDENTITY = -" >> ios/Flutter/Release.xcconfig
          echo "EXPANDED_CODE_SIGN_IDENTITY = -" >> ios/Flutter/Release.xcconfig
      - name: Compilar iOS sin firma
        script: flutter build ios --release --no-codesign
      - name: Empaquetar el artefacto (.app a .ipa sin firmar)
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/unsigned_app.ipa