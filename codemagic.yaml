workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter packages pub get
      - name: Compilar iOS sin firma (Genera el Podfile automáticamente)
        script: flutter build ios --no-codesign --release
      - name: Empaquetar el artefacto (.app a .ipa sin firmar)
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r unsigned_app.ipa Payload
    artifacts:
      - build/ios/iphoneos/unsigned_app.ipa