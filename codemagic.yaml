workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: flutter packages pub get
      - name: Preparar motor de Flutter y CocoaPods
        script: |
          # Flutter compilará el código y enlazará los Pods. 
          # "|| true" evita que la máquina virtual se detenga cuando Flutter arroje el error del Team ID.
          flutter build ios --release --no-codesign || true
      - name: Forzar compilación nativa en crudo (Bypass total)
        script: |
          cd ios
          # Usamos el compilador nativo pasándole las anulaciones como comandos absolutos
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""
      - name: Empaquetar el artefacto (.app a .ipa sin firmar)
        script: |
          mkdir -p Payload
          # Buscamos y copiamos la aplicación compilada a la carpeta de empaquetado
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r unsigned_app.ipa Payload
    artifacts:
      - unsigned_app.ipa