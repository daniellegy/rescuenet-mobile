workflows:
  ios-unsigned-workflow:
    name: iOS Unsigned Build
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      xcode: latest
    scripts:
      - name: Instalar dependencias de Flutter
        script: flutter packages pub get
      - name: Configurar proyecto y dependencias (Sin compilar)
        script: |
          # Genera el Podfile y los archivos base limpiamente
          flutter build ios --release --config-only
          cd ios
          pod install
      - name: Compilación nativa forzada (Bypass total y Sandbox apagado)
        script: |
          cd ios
          # Apagamos los certificados Y la restricción de Sandboxing de Xcode 15
          xcodebuild build \
            -workspace Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            SYMROOT="$(pwd)/../build/ios" \
            BUILD_DIR="$(pwd)/../build/ios" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            ENABLE_USER_SCRIPT_SANDBOXING=NO
      - name: Empaquetar el artefacto (.app a .ipa sin firmar)
        script: |
          mkdir -p Payload
          # Extraemos la app de la carpeta Release-iphoneos generada por xcodebuild
          cp -r build/ios/Release-iphoneos/Runner.app Payload/
          zip -r unsigned_app.ipa Payload
    artifacts:
      - unsigned_app.ipa